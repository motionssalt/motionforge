# ============================================================
# MotionForge — deploy Worker + apply D1 migrations
# ------------------------------------------------------------
# Runs automatically on push to main touching worker/ or
# migrations/. Everything runs on the Actions runner using
# CLOUDFLARE_API_TOKEN — you never need wrangler locally.
# ============================================================
name: deploy
on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "migrations/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install wrangler
        run: npm i -g wrangler@3
      - name: Apply D1 migrations
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Migrations live at ../migrations (repo root); wrangler picks them
          # up via `migrations_dir` on the CLI.
          wrangler d1 migrations apply motionforge \
            --remote \
            --config wrangler.toml \
            $( [ -d ../migrations ] && echo "--migrations-dir ../migrations" )
      - name: Deploy worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy
